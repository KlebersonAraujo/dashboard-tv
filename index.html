<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Recuperação de equipamentos — WM Telecom</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121212;
    --panel: #1c1c1c;
    --panel-border: #2c2c2c;
    --orange: #E1662C;
    --orange-dim: #7a3a1c;
    --green: #4ADE80;
    --green-dim: #16532f;
    --red: #F0554A;
    --red-dim: #5a1f1b;
    --text: #F4F2ED;
    --text-dim: #9A968D;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    width:100%;
    height:100%;
    overflow:hidden;
  }
  body{
    padding:2.2vh 2.5vw;
    display:flex;
    flex-direction:column;
    gap:2.2vh;
  }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:1.1vw;
  }
  .brand-mark{
    height:5.8vh;
    width:auto;
    max-width:12vw;
    object-fit:contain;
    flex-shrink:0;
  }
  .brand-text h1{
    font-size:2.6vh;
    font-weight:700;
    letter-spacing:0.02em;
  }
  .brand-text p{
    font-size:1.6vh;
    color:var(--text-dim);
    font-weight:500;
    margin-top:0.2vh;
  }
  .clock{
    text-align:right;
  }
  .clock .time{
    font-family:'Archivo Black',sans-serif;
    font-size:3.4vh;
    color:var(--orange);
    line-height:1;
  }
  .clock .date{
    font-size:1.5vh;
    color:var(--text-dim);
    margin-top:0.4vh;
    text-transform:capitalize;
  }

  /* ---------- KPI row ---------- */
  .kpis{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:1.4vw;
  }
  .kpi{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:1.4vh;
    padding:2vh 1.4vw;
    border-left:0.5vh solid var(--kpi-accent, var(--panel-border));
  }
  .kpi .label{
    font-size:1.55vh;
    color:var(--text-dim);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .kpi .value{
    font-family:'Archivo Black',sans-serif;
    font-size:5.2vh;
    line-height:1.25;
    margin-top:0.6vh;
    color:var(--kpi-color, var(--text));
  }
  .kpi.positive{ --kpi-accent:var(--green); --kpi-color:var(--green); }
  .kpi.negative{ --kpi-accent:var(--red); --kpi-color:var(--red); }
  .kpi.info{ --kpi-accent:var(--orange); --kpi-color:var(--orange); }

  /* ---------- productivity ---------- */
  .prod-title{
    font-size:1.9vh;
    font-weight:700;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:0.06em;
  }
  .prod-grid{
    flex:1;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));
    gap:1.4vw;
    margin-top:1.2vh;
  }
  .tech-card{
    background:var(--panel);
    border:1px solid var(--panel-border);
    border-radius:1.6vh;
    padding:2.2vh 2vw;
    display:flex;
    flex-direction:column;
  }
  .tech-head{
    display:flex;
    align-items:center;
    gap:1vw;
    margin-bottom:1.8vh;
  }
  .tech-avatar{
    width:4.6vh;
    height:4.6vh;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Archivo Black',sans-serif;
    font-size:2vh;
    color:#141414;
    flex-shrink:0;
  }
  .tech-name{
    font-size:2.4vh;
    font-weight:700;
  }
  .tech-stats{
    display:flex;
    justify-content:space-between;
    gap:1vw;
    margin-bottom:2vh;
  }
  .tech-stat .n{
    font-family:'Archivo Black',sans-serif;
    font-size:4vh;
    line-height:1;
  }
  .tech-stat .l{
    font-size:1.45vh;
    color:var(--text-dim);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    margin-top:0.6vh;
  }
  .tech-stat.recolhido .n{ color:var(--green); }
  .tech-stat.pendente .n{ color:var(--red); }

  .bar-track{
    height:1.6vh;
    border-radius:1vh;
    background:#2a2a2a;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    border-radius:1vh;
    transition:width 2.8s cubic-bezier(.22,1,.36,1); 
  }
  .bar-caption{
    display:flex;
    justify-content:space-between;
    margin-top:1vh;
    font-size:1.5vh;
    color:var(--text-dim);
    font-weight:600;
  }
  .bar-caption .pct{
    color:var(--text);
    font-weight:700;
  }

  footer{
    text-align:right;
    font-size:1.4vh;
    color:var(--text-dim);
  }

  .empty-state{
    color:var(--text-dim);
    font-size:1.8vh;
    text-align:center;
    padding:4vh;
  }

  /* ---------- brilho ambiente no fundo ---------- */
  .glow-bg{
    position:fixed;
    top:-30vh;
    right:-20vw;
    width:70vw;
    height:70vh;
    background:radial-gradient(circle, rgba(225,102,44,0.16) 0%, rgba(225,102,44,0) 70%);
    pointer-events:none;
    z-index:0;
    animation:derivar 22s ease-in-out infinite alternate;
  }
  .glow-bg.secundario{
    top:auto;
    bottom:-35vh;
    right:auto;
    left:-15vw;
    width:60vw;
    height:60vh;
    background:radial-gradient(circle, rgba(74,222,128,0.08) 0%, rgba(74,222,128,0) 70%);
    animation-duration:28s;
    animation-direction:alternate-reverse;
  }
  @keyframes derivar{
    0%   { transform:translate(0,0) scale(1); }
    100% { transform:translate(-4vw,3vh) scale(1.08); }
  }
  header, .kpis, .prod-title, .prod-grid, footer{ position:relative; z-index:1; }

  /* ---------- entrada dos cartões ---------- */
  @keyframes entrarCartao{
    from{
        opacity:0;
        transform:translateY(2vh) scale(.96);
        filter:blur(4px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

.kpi,
.tech-card{
    opacity:0;
    animation:entrarCartao 1.4s cubic-bezier(.22,1,.36,1) forwards;
}

.kpis .kpi:nth-child(1){ animation-delay:.20s; }
.kpis .kpi:nth-child(2){ animation-delay:.45s; }
.kpis .kpi:nth-child(3){ animation-delay:.70s; }
.kpis .kpi:nth-child(4){ animation-delay:.95s; }
.kpis .kpi:nth-child(5){ animation-delay:1.20s; }

  /* ---------- indicador AO VIVO ---------- */
  .live-indicator{
    display:inline-flex;
    align-items:center;
    gap:0.6vh;
    margin-right:1vw;
  }
  .live-dot{
    width:1vh;
    height:1vh;
    border-radius:50%;
    background:var(--green);
    animation:pulsarPonto 1.8s ease-in-out infinite;
  }
  .live-dot.erro{
    background:var(--red);
    animation-duration:0.9s;
  }
  @keyframes pulsarPonto{
    0%, 100% { opacity:1; box-shadow:0 0 0 0 rgba(74,222,128,0.5); }
    50%      { opacity:0.5; box-shadow:0 0 0 0.6vh rgba(74,222,128,0); }
  }
  .live-dot.erro{
    animation-name:pulsarPontoErro;
  }
  @keyframes pulsarPontoErro{
    0%, 100% { opacity:1; box-shadow:0 0 0 0 rgba(240,85,74,0.5); }
    50%      { opacity:0.5; box-shadow:0 0 0 0.6vh rgba(240,85,74,0); }
  }

  /* ---------- destaque quando um valor muda ---------- */
  @keyframes destacarMudanca{

    0%{
        transform:scale(0.88);
        opacity:.4;
        text-shadow:
            0 0 35px currentColor,
            0 0 70px currentColor;
    }

    35%{
        transform:scale(1.12);
        opacity:1;
    }

    100%{
        transform:scale(1);
        text-shadow:none;
    }


  }
  .valor-mudou{
    animation:destacarMudanca 2.8s ease-out;
  }
</style>
</head>
<body>

<div class="glow-bg"></div>
<div class="glow-bg secundario"></div>

<header>
  <div class="brand">
    <img src="logo-wm-telecom.png" alt="WM Telecom" class="brand-mark">
    <div class="brand-text">
      <h1>Recuperação de equipamentos</h1>
      <p id="periodo">Carregando período...</p>
    </div>
  </div>
  <div class="clock">
    <div class="time" id="clock-time">--:--</div>
    <div class="date" id="clock-date">-</div>
  </div>
</header>

<div class="kpis" id="kpi-row">
  <div class="kpi info">
    <div class="label">Aberturas do mês</div>
    <div class="value" id="kpi-aberturas">-</div>
  </div>
  <div class="kpi positive">
    <div class="label">Recolhido</div>
    <div class="value" id="kpi-recolhido">-</div>
  </div>
  <div class="kpi info">
    <div class="label">Voltou a utilizar</div>
    <div class="value" id="kpi-voltou">-</div>
  </div>
  <div class="kpi">
    <div class="label">Agendados</div>
    <div class="value" id="kpi-agendados">-</div>
  </div>
  <div class="kpi negative">
    <div class="label">Pendente devolução</div>
    <div class="value" id="kpi-pendente">-</div>
  </div>
</div>

<div class="prod-title">Produtividade por técnico</div>
<div class="prod-grid" id="prod-grid">
  <div class="empty-state">Carregando dados...</div>
</div>

<footer id="footer"><span class="live-indicator"><span class="live-dot" id="live-dot"></span>AO VIVO</span><span id="footer-texto">Configurando conexão com a planilha...</span></footer>

<script>
/* =========================================================================
   CONFIGURAÇÃO — ajuste só esta parte
   =========================================================================
   O link de "Publicar na web" costuma falhar quando buscado por código
   (erro "Failed to fetch"), mesmo funcionando ao abrir direto no navegador.
   Por isso usamos aqui o endpoint "gviz", feito pelo Google especificamente
   pra ser lido por código externo. Passos:

   1. Abra a planilha e clique na aba "Calculo Dados".
   2. Olhe a URL no navegador, algo como:
      https://docs.google.com/spreadsheets/d/1AbCdEfGh.../edit?gid=123456789#gid=123456789
      - O trecho entre "/d/" e "/edit" é o SPREADSHEET_ID.
      - O número depois de "gid=" é o GID (identifica a aba Calculo Dados).
   3. Cole os dois valores abaixo.
   4. Garanta o compartilhamento: Compartilhar > Acesso geral >
      "Qualquer pessoa com o link" > Leitor. (Sem isso, o gviz também falha.)
   ========================================================================= */
const SPREADSHEET_ID = "1IVctiDEHShtFqoyTPXNgxE35G4KC-NDyDEV0o2PSTY0";
const GID_CALCULO_DADOS = "1967136222";
const CSV_URL = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_ID}/gviz/tq?tqx=out:csv&gid=${GID_CALCULO_DADOS}`;
const INTERVALO_ATUALIZACAO_MS = 3 * 60 * 1000; // 3 minutos

/* Cores fixas por técnico (adicione mais linhas se tiver mais técnicos) */
const CORES_TECNICO = ["#E1662C", "#F4F2ED", "#4ADE80", "#8AB4F8", "#F0554A"];

/* ========================================================================= */

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"' && text[i + 1] === '"') { field += '"'; i++; }
      else if (c === '"') { inQuotes = false; }
      else { field += c; }
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ',') { row.push(field); field = ""; }
      else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === '\r') { /* ignore */ }
      else { field += c; }
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function normalizarTexto(s) {
  if (s === null || s === undefined) return '';
  return s.toString()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .trim()
    .toUpperCase()
    .replace(/\s+/g, ' ');
}

/* Acha a primeira célula cujo texto normalizado CONTÉM o rótulo procurado.
   Retorna {linha, coluna} ou null se não encontrar. */
function acharCelula(grade, rotulo) {
  const alvo = normalizarTexto(rotulo);
  for (let r = 0; r < grade.length; r++) {
    for (let c = 0; c < grade[r].length; c++) {
      if (normalizarTexto(grade[r][c]).includes(alvo)) return { linha: r, coluna: c };
    }
  }
  return null;
}

/* Pega o valor da célula logo abaixo de um rótulo (mesma coluna, linha seguinte) */
function valorAbaixoDoRotulo(grade, rotulo) {
  const pos = acharCelula(grade, rotulo);
  if (!pos) return null;
  const linhaValor = grade[pos.linha + 1];
  return linhaValor ? linhaValor[pos.coluna] : null;
}

function numero(v) {
  if (!v) return 0;
  const n = parseFloat(v.toString().replace(',', '.').replace('%', ''));
  return isNaN(n) ? 0 : n;
}

/* Anima um elemento de número do valor atual até o novo valor, contando
   suavemente, e acende um brilho rápido se o valor realmente mudou. */
function animarNumero(el, novoValor, duracaoMs) {
  if (!el) return;
  duracaoMs = duracaoMs || 800;
  const valorAntigo = parseFloat(el.dataset.valor);
  const partiuDeAlgumValor = !isNaN(valorAntigo);
  // na primeira vez (sem valor anterior), conta a partir de 0 pra dar efeito de abertura
  const inicio = partiuDeAlgumValor ? valorAntigo : 0;

  if (partiuDeAlgumValor && valorAntigo === novoValor) return; // nada mudou, não anima

  const tInicio = performance.now();
  function passo(agora) {
    const progresso = Math.min((agora - tInicio) / duracaoMs, 1);
    const suavizado = 1 - Math.pow(1 - progresso, 3); // ease-out
    const valorAtual = Math.round(inicio + (novoValor - inicio) * suavizado);
    el.textContent = valorAtual;
    if (progresso < 1) {
      requestAnimationFrame(passo);
    } else {
      el.textContent = novoValor;
      el.dataset.valor = novoValor;
      if (partiuDeAlgumValor) {
        el.classList.remove('valor-mudou');
        void el.offsetWidth; // força reiniciar a animação CSS
        el.classList.add('valor-mudou');
      }
    }
  }
  el.dataset.valor = inicio;
  requestAnimationFrame(passo);
}

function atualizarRelogio() {
  const agora = new Date();
  document.getElementById('clock-time').textContent =
    agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('clock-date').textContent =
    agora.toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
}

let nomesRenderizados = null; // lembra quais técnicos foram desenhados da última vez

function renderizarProdutividade(linhasTecnicos) {
  const grid = document.getElementById('prod-grid');

  if (linhasTecnicos.length === 0) {
    grid.innerHTML = '<div class="empty-state">Nenhum técnico encontrado na tabela de produtividade.</div>';
    nomesRenderizados = null;
    return;
  }

  const nomesAtuais = linhasTecnicos.map(l => (l[0] || '').trim());
  const estruturaMudou = !nomesRenderizados ||
    nomesRenderizados.length !== nomesAtuais.length ||
    nomesRenderizados.some((n, i) => n !== nomesAtuais[i]);

  if (estruturaMudou) {
    // Lista de técnicos mudou (primeira carga, ou alguém novo) -> recria com animação de entrada
    grid.innerHTML = "";
    linhasTecnicos.forEach((linha, idx) => {
      const nome = (linha[0] || '').trim();
      const cor = CORES_TECNICO[idx % CORES_TECNICO.length];
      const card = document.createElement('div');
      card.className = 'tech-card';
      card.dataset.nome = nome;
      card.style.animationDelay = (idx * 0.12) + 's';
      card.innerHTML = `
        <div class="tech-head">
          <div class="tech-avatar" style="background:${cor}; color:#141414">${nome.charAt(0).toUpperCase()}</div>
          <div class="tech-name">${nome}</div>
        </div>
        <div class="tech-stats">
          <div class="tech-stat">
            <div class="n valor-total">0</div>
            <div class="l">Total serviços</div>
          </div>
          <div class="tech-stat recolhido">
            <div class="n valor-recolhido">0</div>
            <div class="l">Recolhidos</div>
          </div>
          <div class="tech-stat pendente">
            <div class="n valor-pendente">0</div>
            <div class="l">Pendente</div>
          </div>
        </div>
        <div class="bar-track">
          <div class="bar-fill" style="width:0%; background:${cor}"></div>
        </div>
        <div class="bar-caption">
          <span>Recuperação</span>
          <span class="pct">0,00%</span>
        </div>
      `;
      grid.appendChild(card);
    });
    nomesRenderizados = nomesAtuais;
  }

  // Atualiza os valores de cada cartão (com animação de contagem)
  linhasTecnicos.forEach(linha => {
    const nome = (linha[0] || '').trim();
    const total = numero(linha[1]);
    const recolhido = numero(linha[2]);
    const pendente = numero(linha[3]);
    const pct = total > 0 ? (recolhido / total) * 100 : 0;

    const card = grid.querySelector(`.tech-card[data-nome="${CSS.escape(nome)}"]`);
    if (!card) return;

    animarNumero(card.querySelector('.valor-total'), total);
    animarNumero(card.querySelector('.valor-recolhido'), recolhido);
    animarNumero(card.querySelector('.valor-pendente'), pendente);
    card.querySelector('.bar-fill').style.width = Math.min(pct, 100).toFixed(1) + '%';
    card.querySelector('.pct').textContent = pct.toFixed(2).replace('.', ',') + '%';
  });
}

async function carregarDados() {
  const footerTexto = document.getElementById('footer-texto');
  const liveDot = document.getElementById('live-dot');

  if (CSV_URL.indexOf("COLE_AQUI") !== -1) {
    footerTexto.textContent = "Configure o SPREADSHEET_ID e o GID no código para conectar com a planilha.";
    document.getElementById('prod-grid').innerHTML =
      '<div class="empty-state">Ainda não conectado à planilha — veja as instruções no topo do arquivo.</div>';
    return;
  }

  try {
    const resp = await fetch(CSV_URL + (CSV_URL.includes('?') ? '&' : '?') + 'cachebust=' + Date.now());
    if (!resp.ok) throw new Error('Falha ao buscar CSV: ' + resp.status);
    const buffer = await resp.arrayBuffer();
    const texto = new TextDecoder('utf-8').decode(buffer);
    const grade = parseCSV(texto);

    // Período: procura um padrão "Mês AAAA" em qualquer célula
    let periodoTexto = '';
    for (const linha of grade) {
      for (const celula of linha) {
        const m = (celula || '').match(/[A-Za-zÀ-ÿ]+\s+\d{4}/);
        if (m) { periodoTexto = m[0]; break; }
      }
      if (periodoTexto) break;
    }
    document.getElementById('periodo').textContent = periodoTexto || '';

    // Indicadores principais: acha o rótulo, pega o valor logo abaixo, anima até o novo número
    animarNumero(document.getElementById('kpi-aberturas'), numero(valorAbaixoDoRotulo(grade, 'ABERTAS NO MES')));
    animarNumero(document.getElementById('kpi-recolhido'), numero(valorAbaixoDoRotulo(grade, 'RECOLHIDOS')));
    animarNumero(document.getElementById('kpi-agendados'), numero(valorAbaixoDoRotulo(grade, 'AGENDADOS')));
    animarNumero(document.getElementById('kpi-pendente'), numero(valorAbaixoDoRotulo(grade, 'PENDENTE DE RECOLHIMENTO')));
    animarNumero(document.getElementById('kpi-voltou'), numero(valorAbaixoDoRotulo(grade, 'VOLTOU UTILIZAR')));

    // Produtividade por técnico: acha a célula "Nome", lê as linhas abaixo até achar uma vazia
    const posNome = acharCelula(grade, 'NOME');
    const tecnicos = [];
    if (posNome) {
      for (let r = posNome.linha + 1; r < grade.length; r++) {
        const linha = grade[r];
        const nome = linha ? linha[posNome.coluna] : null;
        if (!nome || !nome.trim()) break;
        tecnicos.push([
          nome,
          linha[posNome.coluna + 1],
          linha[posNome.coluna + 2],
          linha[posNome.coluna + 3],
        ]);
      }
    }
    renderizarProdutividade(tecnicos);

    liveDot.classList.remove('erro');
    footerTexto.textContent = "Última atualização: " + new Date().toLocaleTimeString('pt-BR');
  } catch (err) {
    liveDot.classList.add('erro');
    footerTexto.textContent = "Erro ao atualizar dados: " + err.message + " (mantendo últimos dados exibidos)";
  }
}

atualizarRelogio();
setInterval(atualizarRelogio, 1000);

carregarDados();
setInterval(carregarDados, INTERVALO_ATUALIZACAO_MS);
</script>

</body>
</html>
